name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Kiểm tra mã nguồn & kiểm thử
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Kiểm tra cú pháp GAS, manifest & bundle
        run: npm run check

      - name: Chạy kiểm thử API và giao diện
        run: npm test
