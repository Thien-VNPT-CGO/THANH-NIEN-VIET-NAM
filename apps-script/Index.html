document.addEventListener('submit', function (e) {
  var form = e.target.closest('form[data-sys-form]');
  if (!form) return;
  e.preventDefault();
  var kind = form.dataset.sysForm;
  var btn = form.querySelector('button[type="submit"]');
  if (btn) btn.disabled = true;

  var data = {};
  new FormData(form).forEach(function (v, k) { data[k] = v; });

  var task;
  if (kind === 'unit-info' || kind === 'config') {
    var items = [];
    if (kind === 'unit-info') {
      form.querySelectorAll('input[name]').forEach(function (inp) {
        items.push({ khoa: inp.name, giaTri: inp.value });
      });
    } else {
      form.querySelectorAll('[data-cfg]').forEach(function (inp) {
        items.push({ khoa: inp.dataset.cfg, giaTri: inp.value });
      });
    }
    task = API.call('admin.config.save', { items: items });
  } else if (kind === 'ap') {
    task = API.call('admin.ap.save', {
      maAp: data.maAp || '', tenAp: data.tenAp, biThu: data.biThu,
      chiTieu: data.chiTieu, ghiChu: data.ghiChu
    });
  } else if (kind === 'account') {
    task = API.call('admin.account.create', {
      maDD: data.maDD, hoTen: data.hoTen, cap: data.cap, maAp: data.maAp,
      dienThoai: data.dienThoai, ngaySinh: data.ngaySinh
    });
  } else if (kind === 'account-edit') {
    task = API.call('admin.account.update', {
      maDD: data.maDD, hoTen: data.hoTen, dienThoai: data.dienThoai,
      ngaySinh: data.ngaySinh, ghiChu: data.ghiChu
    });
  } else if (kind === 'account-search') {
    S.data.sysAccountQ = data.q || '';
    task = Promise.resolve({ message: '' });
  } else if (kind === 'log-search') {
    S.data.sysLogQ = data.q || '';
    task = Promise.resolve({ message: '' });
  } else if (kind === 'report-filter') {
    S.data.reportFilter = {
      tuNgay: data.tuNgay, denNgay: data.denNgay, maAp: data.maAp || '', loai: data.loai || 'doanVien'
    };
    task = Promise.resolve({ message: '' });
  } else if (kind === 'notify-send') {
    task = API.call('admin.notify.send', {
      loai: data.loai, maAp: data.maAp, kenh: data.kenh,
      emailNhan: data.emailNhan, tieuDe: data.tieuDe, noiDung: data.noiDung
    });
  } else if (kind === 'backup-restore') {
    task = API.call('admin.backup.restoreCopy', { id: data.id, xacNhan: data.xacNhan });
  } else {
    task = Promise.resolve({ message: '' });
  }

  task.then(function (r) {
    if (kind === 'ap' || kind === 'account' || kind === 'account-edit') closeModal();
    if (kind === 'notify-send' && r && r.maTB) {
      openModal({
        title: 'Đã phát hành nhắc việc',
        sub: r.soNguoi + ' người nhận · ' + r.trangThai,
        body: '<div class="alert-row calm">' + icon('check', 16) + '<span>' + esc(r.message) + '</span></div>' +
          '<div class="field mt-12"><label>Nội dung để đăng nhóm Zalo (nếu cần)</label>' +
            '<textarea class="input" rows="4" readonly>' + esc(r.zaloText || '') + '</textarea></div>' +
          '<button class="btn btn-ghost btn-block mt-8" data-sys-act="close">Đóng</button>'
      });
      refresh();
      return;
    }
    if (kind === 'backup-restore' && r && r.id) {
      closeModal();
      openModal({
        title: 'Đã tạo bản phục hồi',
        sub: r.ten,
        body: '<div class="alert-row">' + icon('check', 16) + '<span>' + esc(r.message) + '</span></div>' +
          '<p class="small muted mt-8">Bản phục hồi nằm trong thư mục CD6_Restore trên Google Drive và chưa thay thế dữ liệu đang chạy.</p>' +
          (r.url && r.url !== '#' ? '<a class="btn btn-primary btn-block mt-12" href="' + esc(r.url) + '" target="_blank" rel="noopener">Mở bản phục hồi</a>' : '') +
          '<button class="btn btn-ghost btn-block mt-8" data-sys-act="close">Đóng</button>'
      });
      return;
    }
    if (r && r.message) toast(r.message, 'ok');
    if (kind === 'account-search' || kind === 'log-search') {
      S.view = 'system';
      refresh();
    } else {
      refresh();
    }
  }).catch(function (err) {
    toast(err.message || String(err), 'err');
  }).then(function () {
    if (btn) btn.disabled = false;
  });
});

function refresh() {
  if (!S.token || !S.me) return;
  // Lấy cấu hình/hồ sơ mới nhất trước khi vẽ lại, để thay đổi của quản trị
  // (tên đơn vị, mức điểm, tên tài khoản...) hiện ngay cả với chính Admin.
  syncConfigNow({ render: false }).then(function () {
    if (S.token && S.me) go(S.view);
  });
}

function getPos() {
  return new Promise(function (resolve) {
    if (!navigator.geolocation) return resolve({});
    navigator.geolocation.getCurrentPosition(
      function (p) { resolve({ viDo: p.coords.latitude, kinhDo: p.coords.longitude }); },
      function () { resolve({}); },
      { timeout: 7000, maximumAge: 30000 }
    );
  });
}

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(function () { toast('Đã sao chép vào bộ nhớ tạm.', 'ok'); })
      .catch(function () { toast('Không sao chép được, hãy chọn văn bản thủ công.', 'err'); });
  } else {
    toast('Trình duyệt không hỗ trợ sao chép tự động.', 'err');
  }
}

function stopQr() {
  if (S.qrTimer) { clearInterval(S.qrTimer); S.qrTimer = null; }
  S.live = null;
}

function startQr(maPhien) {
  stopQr();
  var live = { maPhien: maPhien, conLai: 0 };
  S.live = live;

  var refreshToken = function () {
    API.call('attendance.session', { maPhien: maPhien }).then(function (s) {
      if (!S.live || S.live.maPhien !== maPhien) return;
      S.live = Object.assign(S.live, s);
      paintQr();
    }).catch(function (e) {
      stopQr();
      toast(e.message || 'Phiên điểm danh đã kết thúc.', 'err');
    });
  };

  S.live.refreshToken = refreshToken;
  refreshToken();

  S.qrTimer = setInterval(function () {
    if (!S.live) return;
    S.live.conLai = (S.live.conLai || 0) - 1;
    if (S.live.conLai <= 0) refreshToken();
    else paintCountdown();
  }, 1000);
}

function paintQr() {
  var box = document.getElementById('qr-live');
  if (!box || !S.live) return;
  var l = S.live;
  var people = (l.ds || []).length
    ? l.ds.map(function (p) {
        return '<div class="list-item"><div class="li-avatar green">' + esc(initials(p.hoTen)) + '</div>' +
          '<div class="li-main"><b>' + esc(p.hoTen) + '</b><span>' + esc(p.maDD) + ' · ' + esc(p.hinhThuc) + '</span></div>' +
          '<div class="li-right"><span class="badge badge-green">+' + p.diem + 'đ</span></div></div>';
      }).join('')
    : '<div class="empty">' + icon('qr', 26) + '<div>Chưa có đoàn viên nào điểm danh</div></div>';

  box.innerHTML =
    '<div class="qr-panel">' +
      '<div class="row-between mb-8" style="align-items:flex-start">' +
        '<div style="text-align:left"><b>' + esc(l.tieuDe) + '</b>' +
        '<div class="small muted">' + esc(l.tenAp) + ' · ' + l.daDiemDanh + ' lượt điểm danh</div></div>' +
        badge('Đang mở', 'green') +
      '</div>' +
      '<div class="qr-frame"><img id="qr-img" src="' + qrImg(l.payload, 232) + '" alt="Mã QR điểm danh" ' +
        'onerror="this.style.display=\'none\'"></div>' +
      '<div class="qr-token" id="qr-token">' + esc(l.token) + '</div>' +
      '<div class="qr-count" id="qr-count">' + icon('clock', 13) + ' <span>Mã mới sau ' + l.conLai + 's</span></div>' +
      '<p class="small muted mt-8">Đoàn viên quét bằng camera trực tiếp · Ảnh chụp màn hình sẽ hết hiệu lực</p>' +
      (l.nguoiDuyet && l.nguoiDuyet.uyQuyen
        ? '<div class="note mt-8">Ủy quyền 24h: ' + esc(l.nguoiDuyet.hoTen) + ' đang duyệt thay</div>' : '') +
    '</div>' +
    '<div class="list mt-12">' + people + '</div>';
}

function paintCountdown() {
  var el = document.querySelector('#qr-count span');
  if (el && S.live) el.textContent = 'Mã mới sau ' + Math.max(0, S.live.conLai) + 's';
  var c = document.getElementById('qr-count');
  if (c && S.live) c.classList.toggle('warn', S.live.conLai <= 10);
}

async function startCamera() {
  var video = document.getElementById('cam');
  var box = document.getElementById('cam-box');
  if (!video || !box) return;
  if (!window.jsQR) {
    toast('Thư viện quét QR chưa tải được. Hãy nhập mã token bên dưới.', 'err');
    return;
  }
  box.style.display = 'grid';
  try {
    S.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
    video.srcObject = S.stream;
    video.setAttribute('playsinline', '');
    await video.play();
    toast('Đưa mã QR vào khung hình để điểm danh.', 'ok');

    var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    var lastTry = 0;

    var loop = function () {
      if (!S.stream) return;
      var now = Date.now();
      if (now - lastTry > 220 && video.readyState >= 2 && video.videoWidth) {
        lastTry = now;
        if (canvas.width !== video.videoWidth) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        var img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var code = window.jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
        if (code && code.data) {
          stopCamera();
          handleScanPayload(code.data);
          return;
        }
      }
      requestAnimationFrame(loop);
    };
    loop();
  } catch (err) {
    toast('Không mở được camera: ' + (err.message || 'thiết bị không hỗ trợ') + '. Hãy nhập mã thủ công.', 'err');
    box.style.display = 'none';
  }
}

function stopCamera() {
  if (S.stream) {
    S.stream.getTracks().forEach(function (t) { t.stop(); });
    S.stream = null;
  }
  var v = document.getElementById('cam');
  if (v) v.srcObject = null;
}

async function handleScanPayload(payload) {
  var pos = await getPos();
  try {
    var r = await API.call('attendance.scan', {
      payload: payload,
      hinhThuc: S.data.hinhThuc || 'Trực tiếp',
      viDo: pos.viDo || '',
      kinhDo: pos.kinhDo || ''
    });
    if (S.me) S.me.diem = r.tongDiem;
    toast(r.message, 'ok');
    openModal({
      title: 'Điểm danh thành công',
      body: '<div class="center" style="padding:8px 0">' +
        '<div class="login-logo" style="margin-bottom:12px;background:linear-gradient(145deg,#0E9F6E,#34D399)">' + icon('check', 30) + '</div>' +
        '<b style="font-size:17px">' + esc(r.hoTen) + '</b>' +
        '<p class="small muted mt-8">' + esc(r.hinhThuc) + ' · ' + fmtDate(r.thoiGian) + '</p>' +
        '<div class="row" style="justify-content:center;gap:8px;margin-top:12px">' +
          '<span class="badge badge-green" style="font-size:13px;padding:6px 12px">+' + r.diem + ' điểm</span>' +
          '<span class="badge badge-blue" style="font-size:13px;padding:6px 12px">Tổng: ' + r.tongDiem + 'đ</span>' +
        '</div></div>',
      footer: '<button class="btn btn-primary btn-block" data-act="scan-done">Hoàn tất</button>'
    });
  } catch (e) {
    toast(e.message, 'err');
  }
}

async function sendChat(text) {
  text = String(text || '').trim();
  if (!text) return;
  S.chat.push({ role: 'me', text: text });
  renderChat();
  try {
    var r = await API.call('bot.ask', { text: text });
    S.chat.push({ role: 'bot', text: r.reply });
  } catch (e) {
    S.chat.push({ role: 'bot', text: '⚠️ ' + e.message });
  }
  renderChat();
}

function renderChat() {
  var box = document.getElementById('chat-box');
  if (!box) return;
  box.innerHTML = S.chat.map(function (m) {
    return '<div class="msg ' + (m.role === 'me' ? 'me' : 'bot') + '">' + esc(m.text) + '</div>';
  }).join('');
  box.scrollTop = box.scrollHeight;
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  try {
    fn(el, e);
  } catch (err) {
    toast(err.message || String(err), 'err');
  }
});

document.addEventListener('submit', function (e) {
  var form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  var kind = form.dataset.form;
  var handler = FORMS[kind];
  if (!handler) return;
  var data = {};
  new FormData(form).forEach(function (v, k) { data[k] = v; });
  var btn = form.querySelector('button[type="submit"]');
  if (btn) btn.disabled = true;
  Promise.resolve()
    .then(function () { return handler(data, form); })
    .catch(function (err) { toast(err.message || String(err), 'err'); })
    .then(function () { if (btn) btn.disabled = false; });
});

  'ADMIN': buildTourForCap(0, 'Quản trị viên hệ thống', 'ADMIN'),

  'BT_CHIBO_XA': buildTourForCap(2, 'đồng chí Bí thư Chi bộ Xã', 'BT_CHIBO_XA'),
  'BT_AP01': buildTourForCap(3, 'đồng chí Bí thư Chi đoàn Ấp', 'BT_AP01'),
  'DV01': buildTourForCap(4, 'đoàn viên', 'DV01')
};
TOURS['cap0'] = TOURS['ADMIN'];
TOURS['cap1'] = TOURS['CT_HOILHTN'];
TOURS['cap2'] = TOURS['BT_CHIBO_XA'];
TOURS['cap3'] = TOURS['BT_AP01'];
TOURS['cap4'] = TOURS['DV01'];

function tourStepsFor(maDD, cap) {
  return TOURS[maDD] || TOURS['cap' + cap] || [];
}

/** Có kịch bản hướng dẫn cho tài khoản đang đăng nhập không? */
function demoAccountHasTour() {
  if (!S.me) return false;
  return tourStepsFor(S.me.maDD, S.me.cap).length > 0;
}

/* ------------------------------------------------------------------ */
/* BỘ MÁY HƯỚNG DẪN                                                   */
/* ------------------------------------------------------------------ */

var TOUR_STEP_MS = 8000;

var TOUR_RUN = {
  active: false,
  steps: [],
  idx: 0,
  remain: 0,
  timer: null,
  paused: false,
  targetEl: null,
  targetSelector: null,
  root: null,
  spot: null,
  tip: null,
  onKey: null,
  onAdjust: null
};

function startDemoTour(profile) {
  var me = profile || S.me || {};
  var steps = tourStepsFor(me.maDD, me.cap);
  if (!steps.length) {
    toast('Tài khoản này chưa có kịch bản hướng dẫn trải nghiệm.', 'err');
    return;
  }
  stopDemoTour();
  TOUR_RUN.steps = steps;
  TOUR_RUN.idx = 0;
  TOUR_RUN.active = true;
  buildTourDom();
  bindTourEvents();
  showTourStep();
  toast('Bắt đầu hướng dẫn · ' + (me.hoTen || me.maDD), 'ok');
}

function stopDemoTour() {
  clearTourTimer();
  unbindTourEvents();
  if (TOUR_RUN.root && TOUR_RUN.root.parentNode) TOUR_RUN.root.parentNode.removeChild(TOUR_RUN.root);
  TOUR_RUN.root = null;
  TOUR_RUN.spot = null;
  TOUR_RUN.tip = null;
  TOUR_RUN.active = false;
  TOUR_RUN.targetEl = null;
  TOUR_RUN.targetSelector = null;
  TOUR_RUN.steps = [];
  TOUR_RUN.idx = 0;
}

function endDemoTour(finished) {
  var name = (S.me && (S.me.hoTen || S.me.maDD)) || '';
  stopDemoTour();
  if (finished) toast('Đã hoàn tất hướng dẫn trải nghiệm của ' + name + '.', 'ok');
}

function buildTourDom() {
  var old = document.getElementById('tour-root');
  if (old && old.parentNode) old.parentNode.removeChild(old);
  var root = document.createElement('div');
  root.id = 'tour-root';
  root.className = 'tour-root';
  root.innerHTML = '<div class="tour-spot" id="tour-spot"></div>' +
    '<div class="tour-tip" id="tour-tip"></div>';
  document.body.appendChild(root);
  TOUR_RUN.root = root;
  TOUR_RUN.spot = root.querySelector('#tour-spot');
  TOUR_RUN.tip = root.querySelector('#tour-tip');
}

async function showTourStep() {
  if (!TOUR_RUN.active) return;
  var step = TOUR_RUN.steps[TOUR_RUN.idx];
  if (!step) { endDemoTour(true); return; }

  clearTourTimer();
  TOUR_RUN.paused = false;
  TOUR_RUN.targetEl = null;
  TOUR_RUN.targetSelector = step.target || null;
  if (TOUR_RUN.spot) TOUR_RUN.spot.style.display = 'none';

  // Hiện chú thích ngay ở giữa để người xem luôn đọc được nội dung
  // trong lúc màn hình đang tải, rồi mới di chuyển tới đúng vị trí.
  renderTourTip(step);
  showTipCentered();

  // Mở đúng màn hình / tab trước khi tô sáng.
  try { if (step.view && S.view !== step.view) go(step.view); } catch (e) { /* bỏ qua */ }
  try { if (typeof step.before === 'function') step.before(); } catch (e) { /* bỏ qua */ }

  var el = await resolveTourTarget(step.target);
  if (!TOUR_RUN.active || TOUR_RUN.steps[TOUR_RUN.idx] !== step) return;

  TOUR_RUN.targetEl = el;
  if (el && el.scrollIntoView) {
    // Cuộn tức thời để vị trí tô sáng khớp ngay, tránh "nhảy" trong lúc cuộn mượt.
    try { el.scrollIntoView({ block: 'center', behavior: 'auto' }); } catch (e) { try { el.scrollIntoView(); } catch (e2) { /* bỏ qua */ } }
    await tourDelay(140);
    if (!TOUR_RUN.active || TOUR_RUN.steps[TOUR_RUN.idx] !== step) return;
  }

  positionTour(el);
  startTourTimer();

  // Căn lại lần cuối sau khi bố cục ổn định (ảnh/QR/bản đồ vừa vẽ xong).
  var settleAt = TOUR_RUN.idx;
  setTimeout(function () {
    if (!TOUR_RUN.active || TOUR_RUN.idx !== settleAt) return;
    var cur = TOUR_RUN.targetEl;
    if (cur && cur.isConnected === false && TOUR_RUN.targetSelector) cur = requeryTourTarget();
    TOUR_RUN.targetEl = cur;
    positionTour(cur);
  }, 420);
}

/** Giữ chú thích ở giữa màn hình trong lúc chờ mục tiêu. */
function showTipCentered() {
  var tip = TOUR_RUN.tip;
  if (!tip) return;
  tip.classList.add('tour-tip-center');
  tip.style.top = '';
  tip.style.left = '';
  tip.style.visibility = 'visible';
}

function requeryTourTarget() {
  var selector = TOUR_RUN.targetSelector;
  if (!selector) return null;
  try { return (typeof selector === 'function') ? selector() : document.querySelector(selector); } catch (e) { return null; }
}

/** Chờ phần tử đích xuất hiện (màn hình đang tải dữ liệu bất đồng bộ). */
function resolveTourTarget(selector) {
  if (!selector) return Promise.resolve(null);
  return new Promise(function (resolve) {
    var t0 = Date.now();
    (function check() {
      var el = null;
      try { el = (typeof selector === 'function') ? selector() : document.querySelector(selector); } catch (e) { el = null; }
      if (el && isTourVisible(el)) return resolve(el);
      if (Date.now() - t0 > 5000) return resolve(null);
      setTimeout(check, 120);
    })();
  });
}

function isTourVisible(el) {
  if (!el || !el.getBoundingClientRect) return false;
  if (el.isConnected === false) return false;
  // Bỏ qua khung xương (skeleton) đang tải để không tô sáng nhầm.
  if (el.classList && (el.classList.contains('skeleton') || el.classList.contains('sk-card'))) return false;
  var r = el.getBoundingClientRect();
  return r.width > 2 && r.height > 2;
}

function positionTour(el) {
  var spot = TOUR_RUN.spot;
  var tip = TOUR_RUN.tip;
  if (!spot || !tip) return;
  tip.style.visibility = 'hidden';

  if (el && isTourVisible(el)) {
    var pad = 8;
    var r = el.getBoundingClientRect();
    spot.style.display = 'block';
    spot.style.top = (r.top - pad) + 'px';
    spot.style.left = (r.left - pad) + 'px';
    spot.style.width = (r.width + pad * 2) + 'px';
    spot.style.height = (r.height + pad * 2) + 'px';
    tip.classList.remove('tour-tip-center');
    placeTipNear(r);
  } else {
    spot.style.display = 'none';
    tip.classList.add('tour-tip-center');
    tip.style.top = '';
    tip.style.left = '';
  }
  tip.style.visibility = 'visible';
}

function placeTipNear(r) {
  var tip = TOUR_RUN.tip;
  if (!tip) return;
  var vw = window.innerWidth;
  var vh = window.innerHeight;
  var margin = 12;
  tip.style.top = '0px';
  tip.style.left = '0px';
  var tw = tip.offsetWidth;
  var th = tip.offsetHeight;

  var top;
  var below = r.bottom + 14;
  if (below + th <= vh - margin) top = below;
  else if (r.top - 14 - th >= margin) top = r.top - 14 - th;
  else top = Math.max(margin, Math.min(vh - th - margin, r.top + r.height / 2 - th / 2));

  var left = r.left + r.width / 2 - tw / 2;
  left = Math.max(margin, Math.min(vw - tw - margin, left));

  tip.style.top = top + 'px';
  tip.style.left = left + 'px';
}

function renderTourTip(step) {
  var tip = TOUR_RUN.tip;
  if (!tip) return;
  var total = TOUR_RUN.steps.length;
  var n = TOUR_RUN.idx + 1;
  var isLast = n >= total;
  tip.style.visibility = 'hidden';
  tip.innerHTML =
    '<div class="tour-tip-top">' +
      '<span class="tour-step">Bước ' + n + '/' + total + '</span>' +
      '<button class="tour-x" type="button" data-tour="close" aria-label="Đóng hướng dẫn">' + icon('x', 15) + '</button>' +
    '</div>' +
    (step.tag ? '<div class="tour-tag">' + esc(step.tag) + '</div>' : '') +
    '<h4 class="tour-title">' + esc(step.title || '') + '</h4>' +
    '<p class="tour-body">' + (step.html || esc(step.body || '')) + '</p>' +
    '<div class="tour-meta">' +
      '<div class="tour-count">Tự động chuyển sau <b class="tour-sec">8</b> giây</div>' +
      '<div class="tour-bar"><i style="width:100%"></i></div>' +
    '</div>' +
    '<div class="tour-actions">' +
      '<button class="tour-btn ghost" type="button" data-tour="close">Bỏ qua</button>' +
      '<span class="grow"></span>' +
      '<button class="tour-btn ghost" type="button" data-tour="prev"' + (TOUR_RUN.idx === 0 ? ' disabled' : '') + '>‹ Trước</button>' +
      '<button class="tour-btn primary" type="button" data-tour="next">' + (isLast ? 'Hoàn tất' : 'Tiếp ›') + '</button>' +
    '</div>';
}

function startTourTimer() {
  clearTourTimer();
  TOUR_RUN.remain = TOUR_STEP_MS;
  updateTourCountdown();
  TOUR_RUN.timer = setInterval(function () {
    if (TOUR_RUN.paused) return;
    TOUR_RUN.remain -= 100;
    if (TOUR_RUN.remain <= 0) {
      TOUR_RUN.remain = 0;
      updateTourCountdown();
      nextTourStep();
      return;
    }
    updateTourCountdown();
  }, 100);
}

function clearTourTimer() {
  if (TOUR_RUN.timer) {
    clearInterval(TOUR_RUN.timer);
    TOUR_RUN.timer = null;
  }
}

function updateTourCountdown() {
  var tip = TOUR_RUN.tip;
  if (!tip) return;
  var sec = Math.max(0, Math.ceil(TOUR_RUN.remain / 1000));
  var num = tip.querySelector('.tour-sec');
  var bar = tip.querySelector('.tour-bar > i');
  if (num) num.textContent = sec;
  if (bar) bar.style.width = Math.max(0, Math.min(100, TOUR_RUN.remain / TOUR_STEP_MS * 100)) + '%';
}

function nextTourStep() {
  if (!TOUR_RUN.active) return;
  clearTourTimer();
  if (TOUR_RUN.idx >= TOUR_RUN.steps.length - 1) { endDemoTour(true); return; }
  TOUR_RUN.idx += 1;
  showTourStep();
}

function prevTourStep() {
  if (!TOUR_RUN.active) return;
  clearTourTimer();
  if (TOUR_RUN.idx <= 0) { showTourStep(); return; }
  TOUR_RUN.idx -= 1;
  showTourStep();
}

function bindTourEvents() {
  var tip = TOUR_RUN.tip;
  if (tip) {
    tip.addEventListener('click', function (e) {
      var b = e.target.closest('[data-tour]');
      if (!b) return;
      e.preventDefault();
      var action = b.getAttribute('data-tour');
      if (action === 'next') nextTourStep();
      else if (action === 'prev') prevTourStep();
      else if (action === 'close') endDemoTour(false);
    });
    // Giữ chuột trên chú thích để tạm dừng đếm ngược.
    tip.addEventListener('mouseenter', function () { TOUR_RUN.paused = true; });
    tip.addEventListener('mouseleave', function () { TOUR_RUN.paused = false; });
  }

  TOUR_RUN.onKey = function (e) {
    if (!TOUR_RUN.active) return;
    if (e.key === 'Escape') endDemoTour(false);
    else if (e.key === 'ArrowRight') nextTourStep();
    else if (e.key === 'ArrowLeft') prevTourStep();
  };
  TOUR_RUN.onAdjust = function () {
    if (!TOUR_RUN.active) return;
    var el = TOUR_RUN.targetEl;
    // Màn hình có thể vừa được vẽ lại → tìm lại đúng phần tử theo selector.
    if ((!el || el.isConnected === false) && TOUR_RUN.targetSelector) {
      el = requeryTourTarget();
      TOUR_RUN.targetEl = el;
    }
    if (el && el.isConnected !== false) positionTour(el);
  };
  document.addEventListener('keydown', TOUR_RUN.onKey);
  window.addEventListener('resize', TOUR_RUN.onAdjust);
  window.addEventListener('scroll', TOUR_RUN.onAdjust, true);
}

function unbindTourEvents() {
  if (TOUR_RUN.onKey) document.removeEventListener('keydown', TOUR_RUN.onKey);
  if (TOUR_RUN.onAdjust) {
    window.removeEventListener('resize', TOUR_RUN.onAdjust);
    window.removeEventListener('scroll', TOUR_RUN.onAdjust, true);
  }
  TOUR_RUN.onKey = null;
  TOUR_RUN.onAdjust = null;
}

/* ------------------------------------------------------------------ */
/* GẮN HÀNH ĐỘNG                                                      */
/* ------------------------------------------------------------------ */

ACTIONS['start-tour'] = function () { startDemoTour(S.me); };

window.startDemoTour = startDemoTour;

</script>
</body>
</html>
